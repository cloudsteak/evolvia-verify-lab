[project]
name = "evolvia-verify-lab"
version = "0.1.2"
description = "Lab verification service for Evolvia (Azure Functions + AWS Lambda)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
azure = [
    "azure-functions>=1.21.0",
    "azure-identity>=1.25.1",
    "azure-mgmt-compute>=37.1.0",
    "azure-mgmt-network>=30.1.0",
    "azure-mgmt-search>=9.2.0",
    "azure-mgmt-web>=10.1.0",
    "azure-search-documents>=11.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff.lint.per-file-ignores]
"checks/**" = ["BLE001", "G201", "LOG015"]
"lambda/**" = ["BLE001"]

[tool.uv]
# Azure Functions runtime (glibc 2.31): cryptography 44+ breaks worker indexing
constraint-dependencies = ["cryptography>=43.0.3,<44"]
