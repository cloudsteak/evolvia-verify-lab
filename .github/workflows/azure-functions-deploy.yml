name: Azure Functions - Deploy

on:
  push:
    branches:
      - main
    paths:
      - "azure-function/**"
      - "checks/azure/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/azure-functions-deploy.yml"

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Build deploy package
        run: |
          chmod +x azure-function/build.sh
          azure-function/build.sh

      - name: Deploy to Function App
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VERIFY_FUNCTION_APP }}" \
            --src azure-function/release.zip \
            --build-remote true \
            --timeout 600

      - name: Restart Function App
        run: |
          az functionapp restart \
            --resource-group "${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VERIFY_FUNCTION_APP }}"

      - name: Sync APIM function key
        env:
          RG: ${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_VERIFY_FUNCTION_APP }}
          APIM: ${{ vars.AZURE_VERIFY_APIM_NAME }}
        run: |
          sleep 60
          FUNCTION_KEY=$(az functionapp keys list -g "$RG" -n "$APP" --query "functionKeys.default" -o tsv)
          az apim nv update \
            -g "$RG" \
            --service-name "$APIM" \
            --named-value-id function-key \
            --value "$FUNCTION_KEY" \
            --secret true

      - name: Wait for functions to register
        env:
          RG: ${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_VERIFY_FUNCTION_APP }}
        run: |
          for i in $(seq 1 12); do
            count=$(az functionapp function list -g "$RG" -n "$APP" --query "length(@)" -o tsv)
            echo "Registered functions: ${count}"
            if [ "${count}" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "No functions registered after remote build"
          exit 1

      - name: Smoke test APIM health
        run: |
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" "${{ vars.AZURE_VERIFY_HEALTH_CHECK_URL }}")
          body="${response%HTTP_CODE:*}"
          code="${response##*HTTP_CODE:}"
          echo "Health check returned HTTP ${code}"
          echo "Body: ${body}"
          test "${code}" = "200"
          echo "${body}" | grep -q '"status":"ok"'
