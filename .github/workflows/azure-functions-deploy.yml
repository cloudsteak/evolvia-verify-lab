name: Azure Functions - Deploy

on:
  push:
    branches:
      - main
    paths:
      - "azure-function/**"
      - "checks/azure/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/azure-functions-deploy.yml"

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Build deploy package
        run: |
          chmod +x azure-function/build.sh
          azure-function/build.sh

      - name: Deploy to Function App
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VERIFY_FUNCTION_APP }}" \
            --src azure-function/release.zip \
            --build-remote true \
            --timeout 600

      - name: Restart Function App
        run: |
          az functionapp restart \
            --resource-group "${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VERIFY_FUNCTION_APP }}"

      - name: Wait for Function App health
        env:
          RG: ${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_VERIFY_FUNCTION_APP }}
        run: |
          # Python v2 (@app.route) apps often report 0 via `az functionapp function list`
          # even when routes are live — poll the health endpoint instead.
          FUNCTION_KEY=$(az functionapp keys list -g "$RG" -n "$APP" --query "functionKeys.default" -o tsv)
          HOST=$(az functionapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          for i in $(seq 1 18); do
            response=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
              -H "x-functions-key: ${FUNCTION_KEY}" \
              "https://${HOST}/api/health")
            body="${response%HTTP_CODE:*}"
            code="${response##*HTTP_CODE:}"
            echo "Attempt ${i}: HTTP ${code}"
            if [ "${code}" = "200" ] && echo "${body}" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Function App health check failed"
          echo "Body: ${body}"
          exit 1

      - name: Sync APIM function key
        env:
          RG: ${{ vars.AZURE_VERIFY_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_VERIFY_FUNCTION_APP }}
          APIM: ${{ vars.AZURE_VERIFY_APIM_NAME }}
        run: |
          FUNCTION_KEY=$(az functionapp keys list -g "$RG" -n "$APP" --query "functionKeys.default" -o tsv)
          az apim nv update \
            -g "$RG" \
            --service-name "$APIM" \
            --named-value-id function-key \
            --value "$FUNCTION_KEY" \
            --secret true

      - name: Smoke test APIM health
        run: |
          for i in $(seq 1 6); do
            response=$(curl -s -w "\nHTTP_CODE:%{http_code}" "${{ vars.AZURE_VERIFY_HEALTH_CHECK_URL }}")
            body="${response%HTTP_CODE:*}"
            code="${response##*HTTP_CODE:}"
            echo "Attempt ${i}: HTTP ${code}"
            echo "Body: ${body}"
            if [ "${code}" = "200" ] && echo "${body}" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
