name: Lambda - Lint

on:
  pull_request:
    paths:
      - "lambda/**"
      - "checks/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check lambda/ checks/
